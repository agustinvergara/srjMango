spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mango_db?serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    aws:
      credentials:
        access-key: AWS_ACCESS_KEY
        secret-key: AWS_SECRET_KEY
      region:
        static: us-east-2
      s3:
        bucket: srj-mango-assets
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
server:
  port: 8081
  tomcat:
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB
